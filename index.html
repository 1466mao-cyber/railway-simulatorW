scene.add(new THREE.HemisphereLight(0xddeeff,0x6b7b61,2.2));const sun=new THREE.DirectionalLight(0xfff1d7,2.1);sun.position.set(-200,350,180);scene.add(sun);
const groundMat=new THREE.MeshStandardMaterial({color:0x76936b,roughness:1}),railMat=new THREE.MeshStandardMaterial({color:0x555b5c,metalness:.72,roughness:.45}),sleeperMat=new THREE.MeshStandardMaterial({color:0x5e5246,roughness:1}),ballastMat=new THREE.MeshStandardMaterial({color:0x8b8a83,roughness:1}),concrete=new THREE.MeshStandardMaterial({color:0xb6b6ad,roughness:.95}),redMat=new THREE.MeshStandardMaterial({color:0xe33a35,roughness:.7}),canopyMat=new THREE.MeshStandardMaterial({color:0x5d6e76});

function rand(n){let x=Math.sin(n*127.1+seed*78.233)*43758.5453;return x-Math.floor(x)}function elevation(x,z){return Math.sin(x*.008+seed)*7+Math.cos(z*.009+seed*.7)*5+Math.sin((x+z)*.019)*2}function updateLoad(v,t){$('bar').style.width=v+'%';$('loadText').textContent=t}
function clearGroup(g){g.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material?.map&&o.isSprite){o.material.map.dispose();o.material.dispose()}});g.clear()}
function makeTerrain(){if(terrain){scene.remove(terrain);terrain.geometry.dispose()}const g=new THREE.PlaneGeometry(1600,1600,100,100);g.rotateX(-Math.PI/2);const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,elevation(p.getX(i),p.getZ(i)));g.computeVertexNormals();terrain=new THREE.Mesh(g,groundMat);scene.add(terrain)}
function box(w,h,d,mat,x,y,z,parent=buildings){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);parent.add(m);return m}
function makeTown(){clearGroup(buildings);const walls=[0xd3d4d0,0xc2c7c4,0xe2ded3,0xa7b4b7,0xd0c4b8].map(color=>new THREE.MeshStandardMaterial({color,roughness:.88})),roof=new THREE.MeshStandardMaterial({color:0x626c70,roughness:.9}),road=new THREE.MeshStandardMaterial({color:0x777d7e,roughness:1});for(let x=-640;x<=640;x+=100)for(let z=-640;z<=640;z+=100){if(Math.abs(x)<100&&Math.abs(z)<100)continue;const r=rand(x*3+z*5);if(r<.17)continue;const w=11+rand(x+z)*13,d=12+rand(x-z)*11,h=7+rand(x*9+z)*(r>.85?46:18),px=x+(rand(x+33*z)-.5)*34,pz=z+(rand(z+7*x)-.5)*34,y=elevation(px,pz);box(w,h,d,walls[Math.floor(rand(x*17+z*13)*walls.length)],px,y+h/2,pz);box(w+1,1,d+1,roof,px,y+h+.5,pz)}for(let x=-650;x<=650;x+=100)for(let z=-650;z<=650;z+=100)box(5,.12,85,road,x,elevation(x,z)+.13,z)}
function labelSprite(text){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#10272c';ctx.fillRect(0,0,512,128);ctx.fillStyle='#fff';ctx.font='bold 48px sans-serif';ctx.textAlign='center';ctx.fillText(text,256,83,490);const tex=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false}));s.scale.set(34,8.5,1);return s}
function stationHeading(i){const s=stations[i],other=stations[i+1]||stations[i-1];if(!other)return 0;return Math.atan2(other.z-s.z,other.x-s.x)}
function addStationVisual(s,i){const g=new THREE.Group(),angle=stationHeading(i),dirX=Math.cos(angle),dirZ=Math.sin(angle),nx=-dirZ,nz=dirX,y=elevation(s.x,s.z)+1.7,count=s.platforms||2,length=s.length||120,spacing=5.2;for(let k=0;k<count;k++){const off=(k-(count-1)/2)*spacing,px=s.x+nx*off,pz=s.z+nz*off;const pl=box(length,1,2.3,concrete,px,y+.8,pz,g);pl.rotation.y=-angle;const roof=box(Math.min(length*.65,90),.45,3.4,canopyMat,px,y+5.1,pz,g);roof.rotation.y=-angle;for(const along of [-Math.min(length*.22,30),Math.min(length*.22,30)]){const col=box(.4,3.8,.4,railMat,px+dirX*along,y+3,pz+dirZ*along,g)} }const lbl=labelSprite(s.name);lbl.position.set(s.x,y+13,s.z);g.add(lbl);infrastructure.add(g)}
function routePoints(a,b){const dx=b.x-a.x,dz=b.z-a.z,dist=Math.hypot(dx,dz),n=Math.max(12,Math.ceil(dist/5)),points=[];const nx=-dz/dist,nz=dx/dist;const bend=Math.min(16,dist*.055)*(rand(a.id*43+b.id*7)>.5?1:-1);for(let i=0;i<=n;i++){const t=i/n,off=Math.sin(Math.PI*t)*bend,x=a.x+dx*t+nx*off,z=a.z+dz*t+nz*off;points.push(new THREE.Vector3(x,elevation(x,z)+1.8,z))}return points}
function railBetween(a,b){const dist=Math.hypot(b.x-a.x,b.z-a.z);if(dist<55){issues.push(`${a.name}－${b.name}: 駅間が55m未満`);return false}const points=routePoints(a,b),curve=new THREE.CatmullRomCurve3(points),n=Math.max(16,Math.ceil(dist/4)),grades=[];for(let i=1;i<points.length;i++){const p=points[i-1],q=points[i],horizontal=Math.hypot(q.x-p.x,q.z-p.z);grades.push(Math.abs(q.y-p.y)/Math.max(horizontal,.01))}const maxGrade=Math.max(...grades),bad=maxGrade>.045;if(bad)issues.push(`${a.name}－${b.name}: 最大勾配 ${(maxGrade*100).toFixed(1)}%（目安4.5%超）`);const railCount=trackType==='double'?2:1;for(let tr=0;tr<railCount;tr++){const offset=(tr-(railCount-1)/2)*4.3,centers=[];for(let j=0;j<=n;j++){const t=j/n,p=curve.getPoint(t),tangent=curve.getTangent(t).normalize(),side=new THREE.Vector3(-tangent.z,0,tangent.x).normalize();centers.push(p.addScaledVector(side,offset))}const centerCurve=new THREE.CatmullRomCurve3(centers);infrastructure.add(new THREE.Mesh(new THREE.TubeGeometry(centerCurve,n,1.8,5,false),bad?redMat:ballastMat));for(const side of [-.75,.75]){const railPts=centers.map((p,j)=>{const t=j/n,tan=centerCurve.getTangent(t).normalize(),normal=new THREE.Vector3(-tan.z,0,tan.x).normalize();return p.clone().addScaledVector(normal,side).add(new THREE.Vector3(0,.23,0))});infrastructure.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(railPts),n,.095,4,false),bad?redMat:railMat))}for(let d=0;d<dist;d+=1.2){const t=d/dist,p=centerCurve.getPoint(t),tan=centerCurve.getTangent(t),sl=box(2.65,.16,.25,bad?redMat:sleeperMat,p.x,p.y+.08,p.z,infrastructure);sl.rotation.y=-Math.atan2(tan.z,tan.x)}}return true}
function redraw(){clearGroup(infrastructure);issues=[];stations.forEach(addStationVisual);let links=0;for(let i=1;i<stations.length;i++)if(railBetween(stations[i-1],stations[i]))links++;$('counter').textContent=`駅 ${stations.length} / 接続 ${links} / ${trackType==='double'?'複線':'単線'}`;$('status').textContent=`駅 ${stations.length}か所。駅を追加すると直前の駅と自動接続。`; $('issues').textContent=issues.length?'⚠ 配線警告（赤表示）\n'+issues.slice(0,4).join('\n'):''}

function setMode(m){mode=m;for(const id of ['view','station','remove'])$(id).classList.toggle('active',id===m);$('modeName').textContent={view:'ワールド表示',station:'駅の設置',remove:'駅の撤去'}[m];$('hint').textContent={view:'1本指ドラッグで視点回転、2本指で移動・ズーム。',station:'地面を短くタップして駅を設置。駅名・番線数・ホーム長は設定欄から指定。',remove:'撤去したい駅の近くをタップ。'}[m]}
