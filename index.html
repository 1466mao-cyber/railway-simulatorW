<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Railway Simulator W 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#10191c;color:#f0f3f4;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#scene{position:fixed;inset:0;touch-action:none}#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#142025e8;padding:10px 12px;z-index:2;border-bottom:1px solid #45606a}#top strong{font-size:14px}#top small{display:block;color:#aabfc5;font-size:10px}#toolbar{position:fixed;bottom:12px;left:10px;right:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;z-index:2}button,.filebtn{background:#243940;color:white;border:1px solid #4d6a73;border-radius:9px;padding:11px 12px;font-size:12px;font-weight:600;cursor:pointer}button.active{background:#147d8e;border-color:#72d3df}button:disabled{opacity:.4}#panel{position:fixed;top:70px;left:10px;max-width:min(330px,calc(100vw - 20px));background:#142025dd;border:1px solid #415b63;border-radius:12px;padding:12px;z-index:2;font-size:12px;line-height:1.6}#panel h2{margin:0 0 5px;font-size:14px}#status{color:#9ad5dc}#hint{color:#c3d2d5}#toast{position:fixed;top:70px;right:10px;background:#102b30eb;padding:10px;border-radius:9px;z-index:4;font-size:12px;max-width:60vw;display:none}#loading{position:fixed;inset:0;background:#10191c;z-index:10;display:grid;place-content:center;text-align:center;gap:12px}#progress{width:min(280px,80vw);height:7px;background:#314348;border-radius:9px;overflow:hidden}#bar{width:0;height:100%;background:#4eb9c9;transition:width .2s}input[type=file]{display:none}@media(max-width:600px){#panel{top:64px;max-width:260px}#toolbar button,#toolbar .filebtn{padding:10px 9px;font-size:11px}#top strong{font-size:12px}}
</style></head><body><div id="scene"></div><div id="top"><div><strong>RAILWAY SIMULATOR W</strong><small>3D WORLD • Prototype 0.1</small></div><div style="text-align:right"><span id="clock">06:00</span><br><small id="counter">駅 0 / 線路 0</small></div></div><div id="panel"><h2 id="modeName">ワールド表示</h2><div id="status">ワールドを生成しています</div><div id="hint">1本指で視点回転、2本指で移動・拡大縮小。PCはドラッグで回転、右ドラッグで移動、ホイールで拡大縮小。</div></div><div id="toolbar"><button id="view" class="active">👁 視点</button><button id="station">🚉 駅設置</button><button id="remove">✕ 駅撤去</button><button id="reset">🌏 新規生成</button><button id="save">💾 保存</button><label class="filebtn" for="load">📂 読込</label><input id="load" type="file" accept=".json,application/json"></div><div id="toast"></div><div id="loading"><strong>RAILWAY SIMULATOR W</strong><div>3Dワールドを生成中…</div><div id="progress"><div id="bar"></div></div><small id="loadText">初期化中</small></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/controls/OrbitControls.js';
const $=id=>document.getElementById(id), world=$('scene');const scene=new THREE.Scene();scene.background=new THREE.Color(0xa8c8da);scene.fog=new THREE.Fog(0xa8c8da,700,2100);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,1,3200);camera.position.set(160,170,230);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;renderer.outputColorSpace=THREE.SRGBColorSpace;world.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI/2.15;controls.minDistance=12;controls.maxDistance=900;controls.target.set(0,0,0);controls.touches.ONE=THREE.TOUCH.ROTATE;controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;
scene.add(new THREE.HemisphereLight(0xddeeff,0x6b7b61,2.2));const sun=new THREE.DirectionalLight(0xfff1d7,2.1);sun.position.set(-200,350,180);scene.add(sun);
const groundMat=new THREE.MeshStandardMaterial({color:0x76936b,roughness:1});const railMat=new THREE.MeshStandardMaterial({color:0x555b5c,metalness:.72,roughness:.45});const sleeperMat=new THREE.MeshStandardMaterial({color:0x5e5246,roughness:1});const ballastMat=new THREE.MeshStandardMaterial({color:0x8b8a83,roughness:1});const concrete=new THREE.MeshStandardMaterial({color:0xb6b6ad,roughness:.95});
let terrain,buildings=new THREE.Group(),infrastructure=new THREE.Group(),stations=[],seed=1,mode='view',nextId=1;scene.add(buildings,infrastructure);const raycaster=new THREE.Raycaster();const pointer=new THREE.Vector2();
function rand(n){let x=Math.sin(n*127.1+seed*78.233)*43758.5453;return x-Math.floor(x)}function elevation(x,z){return Math.sin(x*.008+seed)*7+Math.cos(z*.009+seed*.7)*5+Math.sin((x+z)*.019)*2}function updateLoad(v,t){$('bar').style.width=v+'%';$('loadText').textContent=t}
function makeTerrain(){if(terrain){scene.remove(terrain);terrain.geometry.dispose()}const g=new THREE.PlaneGeometry(1600,1600,100,100);g.rotateX(-Math.PI/2);const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,elevation(p.getX(i),p.getZ(i)));g.computeVertexNormals();terrain=new THREE.Mesh(g,groundMat);scene.add(terrain)}
function box(w,h,d,mat,x,y,z,parent=buildings){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);parent.add(m);return m}
function makeTown(){buildings.clear();const walls=[0xd3d4d0,0xc2c7c4,0xe2ded3,0xa7b4b7,0xd0c4b8].map(color=>new THREE.MeshStandardMaterial({color,roughness:.88}));const roof=new THREE.MeshStandardMaterial({color:0x626c70,roughness:.9});const road=new THREE.MeshStandardMaterial({color:0x777d7e,roughness:1});for(let x=-640;x<=640;x+=100){for(let z=-640;z<=640;z+=100){if(Math.abs(x)<100&&Math.abs(z)<100)continue;const r=rand(x*3+z*5);if(r<.17)continue;const w=11+rand(x+z)*13,d=12+rand(x-z)*11,h=7+rand(x*9+z)*((r>.85)?46:18);const px=x+(rand(x+33*z)-.5)*34,pz=z+(rand(z+7*x)-.5)*34;const y=elevation(px,pz);box(w,h,d,walls[Math.floor(rand(x*17+z*13)*walls.length)],px,y+h/2,pz);box(w+1,1,d+1,roof,px,y+h+.5,pz)}}for(let x=-650;x<=650;x+=100){for(let z=-650;z<=650;z+=100){let y=elevation(x,z)+.13;box(5,.12,85,road,x,y,z)}}}
function labelSprite(text){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#10272c';ctx.fillRect(0,0,512,128);ctx.fillStyle='#ffffff';ctx.font='bold 52px sans-serif';ctx.textAlign='center';ctx.fillText(text,256,83);const tex=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false}));s.scale.set(34,8.5,1);return s}
function addStationVisual(s){const g=new THREE.Group();const y=elevation(s.x,s.z)+1.3;const platform=box(45,1.2,7,concrete,s.x,y,s.z,g);platform.userData.stationId=s.id;const canopy=box(31,.55,8,new THREE.MeshStandardMaterial({color:0x5d6e76}),s.x,y+5,s.z,g);for(const dx of [-12,12])for(const dz of [-3,3])box(.45,4,.45,railMat,s.x+dx,y+2.5,s.z+dz,g);const lbl=labelSprite(s.name);lbl.position.set(s.x,y+12,s.z);g.add(lbl);infrastructure.add(g)}
function railBetween(a,b){const ax=a.x,az=a.z,bx=b.x,bz=b.z;const dist=Math.hypot(bx-ax,bz-az);if(dist<55)return false;const dx=(bx-ax)/dist,dz=(bz-az)/dist,perpX=-dz,perpZ=dx;const segments=Math.ceil(dist/7);const points=[];for(let i=0;i<=segments;i++){let t=i/segments,x=ax+(bx-ax)*t,z=az+(bz-az)*t;points.push(new THREE.Vector3(x,elevation(x,z)+1.7,z))}const ballast=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points),segments,3.5,5,false),ballastMat);infrastructure.add(ballast);for(const side of [-.75,.75]){const pts=points.map(p=>new THREE.Vector3(p.x+perpX*side,p.y+.2,p.z+perpZ*side));infrastructure.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),segments,0.095,5,false),railMat))}for(let d=0;d<dist;d+=.75){let t=d/dist,x=ax+(bx-ax)*t,z=az+(bz-az)*t;const sl=box(2.7,.18,.27,sleeperMat,x,elevation(x,z)+1.85,z,infrastructure);sl.rotation.y=-Math.atan2(dz,dx)}return true}
function redraw(){infrastructure.clear();stations.forEach(addStationVisual);for(let i=1;i<stations.length;i++)railBetween(stations[i-1],stations[i]);$('counter').textContent=`駅 ${stations.length} / 線路 ${Math.max(0,stations.length-1)}`;$('status').textContent=`駅 ${stations.length}か所を配置済み。駅を追加すると直前の駅から自動接続します。`}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',3600)}
function setMode(m){mode=m;for(const id of ['view','station','remove'])$(id).classList.toggle('active',id===m);$('modeName').textContent={view:'ワールド表示',station:'駅の設置',remove:'駅の撤去'}[m];$('hint').textContent={view:'1本指ドラッグで視点回転、2本指で移動・ズーム。',station:'地面を短くタップして駅を設置。新しい駅は直前の駅と線路で接続されます。',remove:'撤去したい駅の近くをタップしてください。'}[m]}
for(const m of ['view','station','remove'])$(m).onclick=()=>setMode(m);
let down=null;renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:Date.now()}});renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>9||Date.now()-down.t>550)return;down=null;if(mode==='view')return;const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObject(terrain);if(!hits.length)return;const p=hits[0].point;if(mode==='station'){if(stations.some(s=>Math.hypot(s.x-p.x,s.z-p.z)<55)){toast('駅同士が近すぎます（55m以上離してください）');return}const name=`駅${stations.length+1}`;stations.push({id:nextId++,name,x:p.x,z:p.z});redraw();toast(name+'を設置しました')}else if(mode==='remove'){let i=stations.findIndex(s=>Math.hypot(s.x-p.x,s.z-p.z)<26);if(i<0){toast('駅の近くをタップしてください');return}stations.splice(i,1);redraw();toast('駅を撤去しました')}});
function reset(newSeed){seed=newSeed;stations=[];nextId=1;makeTerrain();makeTown();redraw();controls.target.set(0,elevation(0,0),0);camera.position.set(160,180,240);controls.update()}
$('reset').onclick=()=>{if(confirm('現在のワールドを消して新規生成しますか？ 未保存の変更は失われます。')){reset(Math.floor(Math.random()*100000));toast('新しいワールドを生成しました')}};
$('save').onclick=()=>{const data={format:'railway-simulator-w',version:1,seed,stations};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='railway-simulator-w-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('セーブデータを出力しました')};
$('load').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!=='railway-simulator-w'||data.version!==1||!Array.isArray(data.stations)||data.stations.length>500||!Number.isFinite(data.seed)||!data.stations.every(s=>Number.isFinite(s.x)&&Number.isFinite(s.z)&&Math.abs(s.x)<=800&&Math.abs(s.z)<=800&&typeof s.name==='string'))throw Error('セーブデータの形式が正しくありません');reset(data.seed);stations=data.stations.map(s=>({id:Number(s.id)||nextId++,name:s.name.slice(0,30),x:s.x,z:s.z}));nextId=Math.max(1,...stations.map(s=>s.id+1));redraw();toast('セーブデータを読み込みました')}catch(err){toast('読み込み失敗: '+err.message)}e.target.value=''};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let last=0;function animate(t){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);if(t-last>1500){last=t;$('clock').textContent='06:00'}}
updateLoad(15,'3D描画を初期化');await new Promise(r=>setTimeout(r,70));updateLoad(45,'地形を生成');reset(2401);await new Promise(r=>setTimeout(r,70));updateLoad(85,'建物と道路を配置');await new Promise(r=>setTimeout(r,70));updateLoad(100,'準備完了');$('loading').style.display='none';setMode('view');animate(0);
</script></body></html>
